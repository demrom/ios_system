name: Auxiliary xcframeworks
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  push:
    tags:
      - 'auxiliary-v*'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Toolchain and resources
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          uv --version
          df -h .
          sysctl hw.memsize
          sysctl vm.swapusage
      - name: Build pinned products
        run: nice -n 15 bash build-auxiliary.sh
      - name: Audit final consumer ZIPs
        run: |
          set -euo pipefail
          zips=(.build/auxiliary/make.xcframework.zip .build/auxiliary/mandoc.xcframework.zip .build/auxiliary/unrar.xcframework.zip)
          found=(.build/auxiliary/*.xcframework.zip)
          test "${#found[@]}" = 3
          test -s .build/auxiliary/release.md
          : > .build/auxiliary/checksums.txt
          for zip in "${zips[@]}"; do
            sum=$(swift package compute-checksum "$zip")
            printf '%s  %s\n' "$sum" "$(basename "$zip")" >> .build/auxiliary/checksums.txt
            product=$(basename "$zip" .xcframework.zip)
            bash ci/auxiliary/audit-exports.sh "$product" "$zip" ".build/auxiliary/inputs/published-$product.zip" .build/auxiliary/inputs/ios_system.zip > "$zip.exports.txt"
            uv run ci/audit-artifact.py "$zip" --sha256 "$sum" --max-minos 14.0 > "$zip.audit.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: xcframeworks
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/auxiliary/*.xcframework.zip
            .build/auxiliary/*.audit.json
            .build/auxiliary/*.exports.txt
            .build/auxiliary/checksums.txt
            .build/auxiliary/release.md
  release:
    needs: build
    if: github.repository == 'holzschu/ios_system' && startsWith(github.ref, 'refs/tags/auxiliary-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xcframeworks
          path: dist
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c checksums.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ./*.xcframework.zip checksums.txt
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "Release $GITHUB_REF_NAME" --notes-file release.md ./*.xcframework.zip checksums.txt
          fi
